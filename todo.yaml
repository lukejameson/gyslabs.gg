goal: >
  Implement SEO improvements across the GSY Labs site and blog.

why_how: >
  The site has good foundations (OG tags, JSON-LD on posts, semantic HTML)
  but lacks critical SEO infrastructure: no sitemap.xml, no robots.txt, no
  canonical URLs, no breadcrumb structured data, and massive unoptimised
  images. We'll add these by modifying the blog build script to generate
  them, creating robots.txt, adding canonical links, and optimising images.

expected: >
  After implementation: sitemap.xml and robots.txt at root, canonical URLs on
  all pages, breadcrumb JSON-LD on blog posts, Blog schema on blog index,
  compressed hero image (965KB -> ~150KB). All changes auto-generate from
  the build script so new posts get everything automatically.

status: complete

tasks:
  - phase: 1
    name: Fix build script & sitemap
    status: done
    items:
      - done: true
        action: Add canonical link tags to generated blog post HTML
      - done: true
        action: Add breadcrumb JSON-LD to generated blog post HTML
      - done: true
        action: Add Blog schema JSON-LD to generated blog index HTML
      - done: true
        action: Add canonical link tag to generated blog index HTML
      - done: true
        action: Add sitemap.xml generation to build script

  - phase: 2
    name: Create root-level files
    status: done
    items:
      - done: true
        action: Create robots.txt with sitemap reference
      - done: true
        action: Add canonical URL to index.html
      - done: true
        action: Fix inconsistent meta descriptions on homepage

  - phase: 3
    name: Optimise blog images
    status: done
    items:
      - done: true
        action: Compress welcome-to-the-gsy-labs-blog-image.webp (965KB -> ~150KB)

  - phase: 4
    name: Rebuild & verify
    status: done
    items:
      - done: true
        action: Run npm run build
      - done: true
        action: Verify sitemap.xml, robots.txt, canonical tags are correct

notes:
  - apps (roads.gg, airways.gg, etc.) are separate domains — not included in sitemap
  - sitemap priority: homepage=1.0, blog index=0.8, posts=0.6
  - brew install webp or use cwebp/npx for image compression
  - Blog build script is at blog/build-blog.js
  - All generated blog HTML is in .gitignore

